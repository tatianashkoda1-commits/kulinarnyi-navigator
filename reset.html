<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Обновление навигатора</title>
<style>body{margin:0;font:16px/1.5 Inter,"Segoe UI",system-ui,sans-serif;background:#FDF8F3;color:#2D2A26;display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center}</style></head>
<body><div><h2>Обновляю приложение…</h2><p id="s">Очищаю старую сохранённую версию</p></div>
<script>
(async () => {
  const s = document.getElementById("s");
  try { if ("serviceWorker" in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (_) {}
  try { if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch (_) {}
  s.textContent = "Готово, открываю навигатор…";
  setTimeout(() => location.replace("./?demo&v=" + Date.now()), 900);
})();
</script></body></html>
